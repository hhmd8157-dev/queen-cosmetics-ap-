<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كوزمتك الملكة | Queen Cosmetics</title>
    <meta name="description" content="متجر كوزمتك الملكة - تشكيلة مختارة من أرقى منتجات العناية بالبشرة، الشعر، العطور، اللوشنات والبخور مع خدمة التوصيل السريع لجميع المحافظات." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('queen_theme_mode');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#0D0D10] text-[#1A1A1A] dark:text-[#F4F4F5] antialiased selection:bg-[#C5A059]/20 selection:text-[#1A1A1A] dark:selection:text-white font-['Cairo',sans-serif] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
